<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Sign Comparison Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #3b82f6; /* iter6 color */
            --accent-2: #ec4899; /* TH color */
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .img-container {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
            box-sizing: border-box;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            image-rendering: pixelated;
        }

        .card:hover .img-container img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 1.5rem;
        }

        .filename {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        .predictions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pred-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .pred-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
        }

        .pred-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .pred-iter6 {
            color: var(--accent-1);
        }

        .pred-th {
            color: var(--accent-2);
        }

        .divider {
            width: 1px;
            height: 40px;
            background: var(--glass-border);
            margin: 0 1rem;
        }
        
        .filters {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        
        select {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        
        select:focus {
            border-color: var(--accent-1);
        }

    </style>
</head>
<body>

    <header>
        <h1>🚦 Class Conflict Analyzer</h1>
        <div class="subtitle">iter6 vs TH 예측값 비교 뷰어</div>
        <div class="stats">
            <div class="stat-badge">총 <span id="total-count">0</span>개 충돌 항목</div>
        </div>
    </header>
    
    <div class="filters">
        <select id="filter-iter6">
            <option value="all">6th-iter 클래스 (전체)</option>
        </select>
        <select id="filter-th">
            <option value="all">TH 클래스 (전체)</option>
        </select>
    </div>

    <div class="gallery" id="gallery">
        <!-- Cards will be generated here -->
    </div>

    <script>

            {"id":"10135.png","iter6":3,"th":5},
            {"id":"11238.png","iter6":8,"th":5}
        ];

        const gallery = document.getElementById('gallery');
        const countSpan = document.getElementById('total-count');
        const filterIter6 = document.getElementById('filter-iter6');
        const filterTh = document.getElementById('filter-th');
        
        function populateFilters() {
            const iter6Classes = [...new Set(data.map(item => item.iter6))].sort((a,b)=>a-b);
            const thClasses = [...new Set(data.map(item => item.th))].sort((a,b)=>a-b);
            
            iter6Classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `6th-iter: ${c}`;
                filterIter6.appendChild(opt);
            });
            
            thClasses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `TH: ${c}`;
                filterTh.appendChild(opt);
            });
        }

        function renderGallery() {
            const val6 = filterIter6.value;
            const valTh = filterTh.value;
            
            const filtered = data.filter(item => {
                const match6 = val6 === 'all' || item.iter6.toString() === val6;
                const matchTh = valTh === 'all' || item.th.toString() === valTh;
                return match6 && matchTh;
            });
            
            countSpan.textContent = filtered.length;
            gallery.innerHTML = '';

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Base directory where images are located
                const imgSrc = `./dataset/data 2/Test/${item.id}`;

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${imgSrc}" alt="${item.id}" loading="lazy" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'50\\' height=\\'50\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'%2394a3b8\\' stroke-width=\\'2\\' stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\'%3E%3Ccircle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/%3E%3Cline x1=\\'12\\' y1=\\'8\\' x2=\\'12\\' y2=\\'12\\'/%3E%3Cline x1=\\'12\\' y1=\\'16\\' x2=\\'12.01\\' y2=\\'16\\'/%3E%3C/svg%3E';">
                    </div>
                    <div class="card-content">
                        <div class="filename">${item.id}</div>
                        <div class="predictions">
                            <div class="pred-box">
                                <span class="pred-label">6th-iter</span>
                                <span class="pred-value pred-iter6">${item.iter6}</span>
                            </div>
                            <div class="divider"></div>
                            <div class="pred-box">
                                <span class="pred-label">TH</span>
                                <span class="pred-value pred-th">${item.th}</span>
                            </div>
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Event Listeners
        filterIter6.addEventListener('change', renderGallery);
        filterTh.addEventListener('change', renderGallery);

        // Initialize
        populateFilters();
        renderGallery();

    </script>
</body>
</html>
